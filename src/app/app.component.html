<h1>Data Table</h1>
<table border="2" class="table table-striped">
    <thead>
        <tr>
            <th>id</th>
            <th>Title</th>
            <th>Category</th>
            <th>Price</th>
            <th>Rating</th>
            <th>Stock</th>
        </tr>
    </thead>
    <tbody>
        @for(product of allproducts()|slice:si():si()+perpage();track $index){
        <tr>
            <td>{{product.id}}</td>
            <td>{{product.title}}</td>
            <td>{{product.category}}</td>
            <td>{{product.price}}</td>
            <td>{{product.rating}}</td>
            <td>{{product.stock}}</td>
        </tr>
        }
    </tbody>
    <tfoot>
        <tr>
            <td colspan="6">
                <div class="d-flex justify-content-evenly align-items-center">
                    <div>
                        <label for="">PerPage</label>
                        <select (change)="updatePerPage($event)">
                            <option value="5" selected>5</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                        </select>
                    </div>
                    <div>
                        <button class="btn btn-dark" (click)="prevPage()">Prev</button>
                        <button class="btn btn-secondary" (click)="nextPage()">Next</button>
                    </div>
                </div>
            </td>
        </tr>


    </tfoot>
</table>

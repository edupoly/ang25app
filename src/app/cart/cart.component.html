<h3>{{cartLength}}</h3>
<ul class="d-flex flex-wrap gap-1">
    @for(item of cart;track $index){
    <li class="d-flex justify-content-between align-items-center">
        <img [src]="item?.thumbnail" class="ratio ratio-1x1re" style="width: 100px;" alt="">
        <b>{{item?.title}}</b>
    </li>
    }
</ul>

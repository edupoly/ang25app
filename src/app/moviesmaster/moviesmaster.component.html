<div class="border border-2 p-2 m-2 border-primary">
    <ul class="d-flex flex-wrap list-unstyled">
        @for(movie of allmovies();track $index){
        <a [routerLink]="['/movieDetails',movie.id]">
            <li class="w-25 p-2">
                <img [src]="movie.imageUrl" alt="" width="150px">
                <br>
                <b>{{movie.title}}</b>
            </li>
        </a>
        }
    </ul>

</div>

<div class="m-5 text-center border border-2 p-2 m-2">
    <h1>Edupoly Todolist</h1>
    <input type="text" (keyup)="updateNewTodo($event)">
    <button class="btn btn-primary btn-sm m-2" (click)="addTodo()">Add Todo</button>
    <ul class="text-start">
        @for(todo of todos();track $index){
        <app-todo [todo]="todo" (delTodo)="deleteTodo(todo.id)" (togTodo)="toggleTodo(todo.id)"></app-todo>
        }
    </ul>
</div>

<div style="width:100vw;height:100vh" class="">
    <h2>Point Of Sale</h2>
    <div class="d-flex">
        <div style="width:65%" class="">
            <div class="d-flex flex-wrap justify-content-evenly gap-2">
                @for(product of allproducts();track $index){
                <div class="card d-flex flex-column justify-content-end" style="width: 12rem;">
                    <img [src]="product.thumbnail" class="card-img-top" alt="...">
                    <div class="card-body d-flex flex-column justify-content-end">
                        <h5 class="card-title">{{product.title}} {{product.price|currency}}</h5>
                        @if(isProductInCart(product)){
                        <div>
                            <i class="bi bi-dash-circle-fill fs-4" (click)="decQuantity(product)"></i>
                            <b class="p-2 fs-4">{{isProductInCart(product).quantity}}</b>
                            <i class="bi bi-plus-circle-fill fs-4" (click)="incQuantity(product)"></i>
                        </div>
                        }
                        @else{
                        <button (click)="addToCart(product)" class="btn btn-success">Add to Cart</button>
                        }
                    </div>
                </div>
                }
            </div>
        </div>
        <div style="width:35%" class="">
            <app-cart [cartItems]="cartProducts()" (incCItemEvent)="incQuantity($event)"
                (decCItemEvent)="decQuantity($event)"></app-cart>
        </div>
    </div>
</div>
